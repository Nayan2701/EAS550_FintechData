version: 2

models:
  - name: fct_transactions
    description: "Core fact table for financial transactions."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: amount
        tests:
          - not_null

  - name: dim_accounts
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
          
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null